name: Deploy Samuel Remote Manager Firebase Storage rules

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy-storage-rules:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_SAMUEL_REMOTE_MANAGER }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Firebase CLI
        run: npm install --global firebase-tools

      - name: Deploy Firebase Storage rules
        run: firebase deploy --only storage --project samuel-remote-manager --non-interactive
