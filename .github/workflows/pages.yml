name: Deploy Samuel Remote Manager website and APK
on:
  push:
    branches: [main]
    paths:
      - "index.html"
      - "messages.html"
      - ".github/workflows/pages.yml"
  workflow_run:
    workflows: ["Build Samuel Remote Manager Android APK"]
    types: [completed]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Prepare website files
        run: |
          mkdir -p _site
          cp index.html messages.html _site/
          touch _site/.nojekyll
      - name: Find latest successful Android build
        id: android-build
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_run" ]; then
            RUN_ID="${{ github.event.workflow_run.id }}"
          else
            RUN_ID="$(gh run list --workflow android.yml --status success --limit 1 --json databaseId --jq '.[0].databaseId')"
          fi
          if [ -z "$RUN_ID" ] || [ "$RUN_ID" = "null" ]; then
            echo "No successful Android APK build was found." >&2
            exit 1
          fi
          echo "run_id=$RUN_ID" >> "$GITHUB_OUTPUT"
      - name: Download APK from successful Android build
        uses: actions/download-artifact@v4
        with:
          name: Samuel-Remote-Manager-APK
          path: _site
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: ${{ steps.android-build.outputs.run_id }}
      - name: Publish APK with stable public filename
        run: cp _site/app-debug.apk _site/Samuel-Remote-Manager.apk
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload website artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify deployed website and APK
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          set -euo pipefail
          for attempt in $(seq 1 12); do
            if curl --fail --silent --show-error "$PAGE_URL" -o /tmp/samuel-manager-home.html && grep -qi "Samuel Remote Manager" /tmp/samuel-manager-home.html; then
              break
            fi
            if [ "$attempt" -eq 12 ]; then
              echo "GitHub Pages did not serve the expected dashboard after deployment." >&2
              exit 1
            fi
            sleep 10
          done
          curl --fail --silent --show-error --head "$PAGE_URL/Samuel-Remote-Manager.apk" >/dev/null
          echo "Website and APK download both respond successfully."
