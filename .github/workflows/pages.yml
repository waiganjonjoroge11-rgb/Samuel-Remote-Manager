name: Deploy Samuel Remote Manager website and APK
on:
  push:
    branches: [main]
    paths:
      - "index.html"
      - "messages.html"
      - "app/**"
      - "*.gradle.kts"
      - "gradle.properties"
      - ".github/workflows/pages.yml"
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"
      - name: Set up Android SDK
        run: |
          yes | "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" --licenses || true
          "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" "platform-tools" "platforms;android-36" "build-tools;36.0.0"
      - name: Build Android APK
        run: gradle --no-daemon clean assembleDebug --stacktrace
      - name: Prepare website and APK download
        run: |
          set -euo pipefail
          mkdir -p _site
          cp index.html messages.html _site/
          cp app/build/outputs/apk/debug/app-debug.apk _site/Samuel-Remote-Manager.apk
          touch _site/.nojekyll
          test -s _site/Samuel-Remote-Manager.apk
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload website artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify deployed website and APK
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          set -euo pipefail
          for attempt in $(seq 1 12); do
            if curl --fail --silent --show-error "${PAGE_URL}" -o /tmp/samuel-manager-home.html && grep -qi "Samuel Remote Manager" /tmp/samuel-manager-home.html; then
              break
            fi
            if [ "$attempt" -eq 12 ]; then
              echo "GitHub Pages did not serve the expected dashboard." >&2
              exit 1
            fi
            sleep 10
          done
          for attempt in $(seq 1 12); do
            if curl --location --fail --silent --show-error --head "${PAGE_URL%/}/Samuel-Remote-Manager.apk" >/dev/null; then
              echo "Website and APK download both respond successfully."
              exit 0
            fi
            if [ "$attempt" -eq 12 ]; then
              echo "The APK download did not become available after deployment." >&2
              exit 1
            fi
            sleep 10
          done
