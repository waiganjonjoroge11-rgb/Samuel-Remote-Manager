name: Deploy Samuel Remote Manager website and APK
on:
  push:
    branches: [main]
    paths:
      - "index.html"
      - "messages.html"
      - ".github/workflows/pages.yml"
  workflow_run:
    workflows: ["Build Samuel Remote Manager Android APK"]
    types: [completed]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Prepare website files
        run: |
          mkdir -p _site
          cp index.html messages.html _site/
          touch _site/.nojekyll
      - name: Download APK from successful Android build
        if: github.event_name == 'workflow_run'
        uses: actions/download-artifact@v4
        with:
          name: Samuel-Remote-Manager-APK
          path: _site
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: ${{ github.event.workflow_run.id }}
      - name: Publish APK with stable public filename
        if: github.event_name == 'workflow_run'
        run: cp _site/app-debug.apk _site/Samuel-Remote-Manager.apk
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload website artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
